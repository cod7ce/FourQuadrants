name: FourQuadrants
options:
  bundleIdPrefix: com.cod7ce
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    # 本地临时签名（Sign to Run Locally）：无需开发团队即可在本机运行
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
targets:
  FourQuadrants:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cod7ce.FourQuadrants
        PRODUCT_NAME: FourQuadrants
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_ENTITLEMENTS: Sources/FourQuadrants.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: 肆
        INFOPLIST_KEY_NSAppleEventsUsageDescription: 用于把本周任务导出到「备忘录」。
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
  FourQuadrantsTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: Tests
    dependencies:
      - target: FourQuadrants
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cod7ce.FourQuadrants.Tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FourQuadrants.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FourQuadrants"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  FourQuadrants:
    build:
      targets:
        FourQuadrants: all
        FourQuadrantsTests: [test]
    test:
      targets:
        - FourQuadrantsTests
